<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#efeee2">
  <title>20 张新候选 · 妮古喵喵封面选图</title>
  <link rel="icon" href="../images/yanineko/chara-icon01.webp">
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#252525;background:#efeee2;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;background-image:radial-gradient(#25252513 .8px,transparent .8px);background-size:12px 12px}
    button,a,input{touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #3d735c;outline-offset:4px}
    main{max-width:1480px;margin:auto;padding:44px 32px 130px}.eyebrow{display:inline-block;background:#252525;color:#ffbd26;font-size:12px;font-weight:800;letter-spacing:.14em;padding:10px 14px}
    header{margin-bottom:30px}header>div{display:flex;align-items:center;justify-content:space-between;gap:16px}header a{font-size:14px}h1{font-size:clamp(28px,4vw,46px);line-height:1.2;margin:22px 0 12px;letter-spacing:-.04em}header p{color:#62665c;margin:0;line-height:1.8}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#faf9f0;border:2px solid #252525;border-radius:12px;overflow:hidden;box-shadow:4px 5px 0 #25252515;transition:box-shadow .15s}.card:has(input:checked){box-shadow:5px 6px 0 #f9b619}
    .confirmed{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:24px 0 32px;padding:16px;background:#e0e6d2;border:1px solid #66725a55;border-radius:10px}.confirmed p{flex:1 1 260px;margin:0;line-height:1.7;font-size:14px}.confirmed strong{display:block}.confirmed button{position:relative;padding:0;border:1px solid #66725a55;border-radius:6px;overflow:hidden;background:#f6f5eb;width:88px;height:70px;flex:none}.confirmed img{height:100%;width:100%;object-fit:contain}.confirmed span{position:absolute;bottom:0;left:0;background:#252525;color:white;font-size:11px;padding:2px 5px}section>h2{font-size:20px;margin:0 0 20px}.previous{margin-top:36px;border-top:1px dashed #737565;padding-top:20px}.previous summary{font-weight:700;cursor:pointer;margin-bottom:22px}.selection>div{min-width:0}.selection p{overflow-wrap:anywhere}
    .preview{display:block;position:relative;width:100%;padding:12px;border:0;border-bottom:1px solid #25252528;background:#e6e9d9;aspect-ratio:4/3}.preview img{display:block;width:100%;height:100%;object-fit:contain}.number{position:absolute;top:14px;left:14px;background:#252525;color:#fff;font-weight:800;border-radius:5px;padding:6px 10px;font-size:15px}.zoom{position:absolute;right:12px;bottom:12px;background:#faf9f0ed;border-radius:4px;padding:4px 8px;font-size:12px}
    .details{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.details h2{font-size:16px;margin:0;font-weight:700}.choose{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;white-space:nowrap;padding:6px 0}.choose input{accent-color:#252525;width:18px;height:18px;margin:0}
    footer{font-size:12px;color:#62665c;line-height:1.9;margin-top:32px}.selection{position:fixed;bottom:0;left:0;right:0;border-top:2px solid #252525;background:#faf9f0f7;z-index:2;padding:16px max(24px,calc((100vw - 1416px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;backdrop-filter:blur(12px)}.selection p{margin:0;line-height:1.6;font-size:14px}.selection button,.dialog-controls button{border:1.5px solid #252525;border-radius:6px;background:#ffbd26;padding:10px 16px;font-weight:700;white-space:nowrap}.selection button:disabled{opacity:.4;cursor:default}#copy-status{font-size:12px;color:#526d50;min-height:18px;display:block}
    dialog{width:min(1100px,94vw);max-height:94vh;padding:14px;border:2px solid #252525;border-radius:12px;background:#efeee2;color:#252525}dialog::backdrop{background:#131510c7;backdrop-filter:blur(4px)}.dialog-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.dialog-controls h2{font-size:18px;margin:0}.dialog-controls button{padding:8px 12px;background:#faf9f0}#large-image{display:block;width:100%;height:min(68vh,780px);object-fit:contain}.dialog-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 4px 2px;font-size:14px}.dialog-footer a{font-size:12px}
    @media(min-width:1400px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:26px 16px 140px}.grid{grid-template-columns:1fr;gap:20px}.confirmed{gap:8px}.confirmed button{width:clamp(44px,12vw,64px);height:48px}.confirmed p{flex-basis:100%;margin-top:4px}.selection{padding:12px 16px;gap:12px}.selection button{padding:10px 12px}header a{font-size:12px}.eyebrow{font-size:10px}h1{margin-top:20px}.dialog-controls h2{font-size:15px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">YANI NEKO / COVER PICKS</span><a href="../">返回学术主页 ↗</a></div>
      <h1>再挑 20 张，看看哪张合眼缘。</h1>
      <p>这批都是新画面，沿用编号 11–30。点击放大，可以多选。</p>
    </header>
    <div class="confirmed" aria-label="已确认的首页图片">
      <button type="button" data-open="01" aria-label="放大已选 01 日常全身立绘"><img src="../images/yanineko/chara-pic01.webp" alt="已选 01 日常全身立绘"><span>01</span></button>
      <button type="button" data-open="09" aria-label="放大已选 09 阳台闲聊"><img src="./images/09.webp" alt="已选 09 阳台闲聊"><span>09</span></button>
      <button type="button" data-open="17" aria-label="放大已选 17 挥拳打气"><img src="./images/17.webp" alt="已选 17 挥拳打气"><span>17</span></button>
      <button type="button" data-open="21" aria-label="放大已选 21 透过绿杯看世界"><img src="./images/21.webp" alt="已选 21 透过绿杯看世界"><span>21</span></button>
      <button type="button" data-open="24" aria-label="放大已选 24 随性躺平"><img src="./images/24.webp" alt="已选 24 随性躺平"><span>24</span></button>
      <p><strong>01 / 09 / 17 / 21 / 24 已选入首页</strong>新的选择可以继续加进来。</p>
    </div>
    <section aria-labelledby="new-heading"><h2 id="new-heading">新的 20 张 · 11–30</h2><div class="grid" id="gallery"></div></section>
    <details class="previous"><summary>回看上一批 · 01–10</summary><div class="grid" id="previous-gallery"></div></details>
    <noscript><p>请开启 JavaScript 查看选图页。</p></noscript>
    <footer>图片来自 <a href="https://yanineko-anime.com/" target="_blank" rel="noopener noreferrer">TV 动画《ヤニねこ》官方网站</a> 和 <a href="https://magazine.yanmaga.jp/c/yanineko/" target="_blank" rel="noopener noreferrer">讲谈社 Young Magazine</a>，每张大图下方可查看原图。<br>动画：©にゃんにゃんファクトリー・講談社／ヤニねこ製作委員会　原作：©にゃんにゃんファクトリー／講談社</footer>
  </main>
  <aside class="selection" aria-label="已选图片">
    <div><p id="selection-text" aria-live="polite">还没有选图</p><span id="copy-status" role="status">选择会保存在当前浏览器中</span></div>
    <button id="copy" type="button" disabled>复制所选编号</button>
  </aside>
  <dialog id="lightbox" aria-labelledby="dialog-title">
    <div class="dialog-controls"><h2 id="dialog-title"></h2><button id="close" type="button" aria-label="关闭大图">关闭 ✕</button></div>
    <img id="large-image" alt="">
    <div class="dialog-footer"><label class="choose"><input id="dialog-choice" type="checkbox">选这张</label><a id="source-link" target="_blank" rel="noopener noreferrer">官方原图 ↗</a></div>
  </dialog>
  <script type="module">
    import { newCandidates } from './new-candidates.js';
    const official = 'https://yanineko-anime.com/wp/wp-content/';
    const pictures = [
      ['01','日常全身立绘','chara-pic01.webp','themes/yanineko-theme/images/chara-pic01.webp'],
      ['02','走廊上的微笑','hero-everyday-smile.webp','uploads/2026/07/yanineko_03-03.jpg'],
      ['03','户外伸个懒腰','hero-outdoor-cheer.webp','uploads/2026/07/yanineko_03-01.jpg'],
      ['04','和朋友一起出门','hero-friends-kyoto.webp','uploads/2026/09/yanineko_11-02.jpg'],
      ['05','阳台上的一支烟','kv00.webp','themes/yanineko-theme/images/kv00.webp'],
      ['06','巷子里的大家','hero-key-visual.webp','themes/yanineko-theme/images/kv01.webp'],
      ['07','点烟的近景','hero-closeup.webp','uploads/2026/07/yanineko_01-01.jpg'],
      ['08','打工中的小表情','hero-workday.webp','uploads/2026/07/yanineko_01-02.jpg'],
      ['09','阳台闲聊','09.webp','uploads/2026/07/yanineko_02-02.jpg'],
      ['10','好奇的双人近景','10.webp','uploads/2026/07/yanineko_04-01.jpg'],
    ].map(([id,title,file,source]) => ({id,title,src:Number(id)>8?'./images/'+file:'../images/yanineko/'+file,source:official+source})).concat(newCandidates);
    const key='tianyi-cover-picks-v3';
    let selected=new Set(['01','09','17','21','24']);
    try { const saved=JSON.parse(localStorage.getItem(key)||'null'); if(Array.isArray(saved)) selected=new Set(saved.filter(id=>pictures.some(p=>p.id===id))); } catch {}
    const gallery=document.querySelector('#gallery'),dialog=document.querySelector('#lightbox'),copy=document.querySelector('#copy'),status=document.querySelector('#copy-status');
    let active=null;
    const card=p=>`<article class="card"><button class="preview" type="button" data-open="${p.id}" aria-label="放大 ${p.id} ${p.title}"><img src="${p.src}" alt="${p.title}" decoding="async"><span class="number">${p.id}</span><span class="zoom">点击放大 ↗</span></button><div class="details"><h2>${p.title}</h2><label class="choose"><input type="checkbox" data-pick="${p.id}" aria-label="选择 ${p.id} ${p.title}">选这张</label></div></article>`;
    gallery.innerHTML=pictures.filter(p=>Number(p.id)>10).map(card).join('');
    document.querySelector('#previous-gallery').innerHTML=pictures.filter(p=>Number(p.id)<=10).map(card).join('');
    function render(){
      const ids=[...selected].sort();
      document.querySelector('#selection-text').textContent=ids.length?'已选 '+ids.length+' 张：'+ids.join('、'):'还没有选图';
      copy.disabled=!ids.length;
      document.querySelectorAll('[data-pick]').forEach(input=>input.checked=selected.has(input.dataset.pick));
      if(active)document.querySelector('#dialog-choice').checked=selected.has(active.id);
      try{localStorage.setItem(key,JSON.stringify(ids));}catch{}
    }
    function choose(id,checked){checked?selected.add(id):selected.delete(id);status.textContent='选好后，复制编号发给我即可';render();}
    document.querySelector('main').addEventListener('change',event=>{if(event.target.matches('[data-pick]'))choose(event.target.dataset.pick,event.target.checked);});
    document.querySelector('main').addEventListener('click',event=>{
      const button=event.target.closest('[data-open]');if(!button)return;
      active=pictures.find(p=>p.id===button.dataset.open);
      document.querySelector('#dialog-title').textContent=active.id+' · '+active.title;
      const image=document.querySelector('#large-image');image.src=active.src;image.alt=active.title;
      document.querySelector('#source-link').href=active.source;
      document.querySelector('#dialog-choice').checked=selected.has(active.id);
      dialog.showModal();
    });
    document.querySelector('#dialog-choice').addEventListener('change',event=>{if(active)choose(active.id,event.target.checked);});
    document.querySelector('#close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)dialog.close();});
    copy.addEventListener('click',async()=>{
      const text='我选 '+[...selected].sort().join('、')+' 号图片。';
      try{await navigator.clipboard.writeText(text);status.textContent='已复制，粘贴发给我即可';}catch{status.textContent=text+'（请手动复制）';}
    });
    render();
  </script>
</body>
</html>
